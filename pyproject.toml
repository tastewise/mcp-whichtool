[project]
name = "mcp-whichtool"
version = "0.0.1"
description = "Evaluate tool routing on an MCP server: which tool each model picks, why it loses, and a better description to fix it."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    "starlette>=0.40",
    "httpx>=0.27",
    "fastapi>=0.115",
    "anthropic>=1.14.0",
    "uvicorn>=0.30",
    "tree-sitter>=0.25",
    "tree-sitter-typescript>=0.23.2",
]

[project.scripts]
whichtool = "whichtool.cli:main"

[dependency-groups]
dev = [
    "mcp>=2.3.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.4.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# A test that hangs fails with its stack instead of holding CI until the runner gives up.
timeout = 60
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["whichtool"]

# The demo the home page opens: its source and its cases ship inside the package.
[tool.hatch.build.targets.wheel.force-include]
"demo/server.py" = "whichtool/demo/server.py"
"demo/routing_cases.json" = "whichtool/demo/routing_cases.json"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
